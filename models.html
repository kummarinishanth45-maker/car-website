<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Models</title>
  <link rel="stylesheet" href="stylecar.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <section class="models" id="models">
    <div class="heading">
      <span>Our Cars</span>
      <h1>Explore Our Best Car Models</h1>
    </div>
    <div class="models-container">
      <div class="box">
        <img src="images/sedan.jpg" alt="Sedan"/>
        <h2>Sedan</h2>
        <h3>Rs. 1,000,000</h3>
        <a href="#" class="btn">Order Now</a>
      </div>
      <div class="box">
        <img src="images/suv.jpeg" alt="SUV"/>
        <h2>SUV</h2>
        <h3>Rs. 1,500,000</h3>
        <a href="#" class="btn">Order Now</a>
      </div>
      <div class="box">
        <img src="images/sports.jpg" alt="Sports"/>
        <h2>Sports Car</h2>
        <h3>Rs. 3,000,000</h3>
        <a href="#" class="btn">Order Now</a>
      </div>
      <div class="box">
        <img src="images/electric-car.jpeg" alt="Electric"/>
        <h2>Electric Car</h2>
        <h3>Rs. 2,500,000</h3>
        <a href="#" class="btn">Order Now</a>
      </div>
    </div>
   

  </section>
</body>
</html>
